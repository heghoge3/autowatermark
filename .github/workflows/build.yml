name: Build Windows exe
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pyinstaller
      - run: pyinstaller --onefile --windowed --name AutoWatermark autowatermark.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoWatermark
          path: dist/AutoWatermark.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: AutoWatermark (latest)
          files: dist/AutoWatermark.exe
